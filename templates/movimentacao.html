<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Inventário TI - Registrar Movimentação</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand"><h2>Inventário TI</h2><span>Equipe de Infra</span></div>
            <ul class="sidebar-menu">
                <li><a href="{{ url_for('inicio') }}">Dashboard</a></li>
                <li><a href="{{ url_for('listar_equipamentos') }}">Equipamentos</a></li>
                <li><a href="{{ url_for('colaboradores') }}">Colaboradores</a></li>
                <li><a href="{{ url_for('atribuicoes') }}">Atribuições</a></li>
                <li><a href="{{ url_for('manutencao') }}">Manutenção</a></li>
                <li><a href="{{ url_for('estoque') }}">Estoque</a></li>
                <li><a href="{{ url_for('relatorios') }}">Relatórios</a></li>
                <li><a href="{{ url_for('configuracoes') }}">Configurações</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <header class="top-header"><h1>Registrar Movimentação / Troca</h1></header>
            <section class="dashboard-section">
                <div class="form-container" style="max-width: 600px; background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color);">
                    <form action="{{ url_for('movimentacao') }}" method="POST">
                        <div class="form-group" style="margin-bottom: 14px;">
                            <label for="equipamento_id" style="display: block; margin-bottom: 6px;">Selecionar Equipamento (Ativo)</label>
                            <select id="equipamento_id" name="equipamento_id" required style="width: 100%; padding: 10px; background: #1e293b; color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                                {% for eq in equipamentos %}
                                    <option value="{{ eq.id }}">{{ eq.patrimonio }} - {{ eq.tipo }} ({{ eq.fabricante }} {{ eq.modelo }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group" style="margin-bottom: 14px;">
                            <label for="colaborador_id" style="display: block; margin-bottom: 6px;">Novo Colaborador Responsável</label>
                            <select id="colaborador_id" name="colaborador_id" style="width: 100%; padding: 10px; background: #1e293b; color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                                <option value="">Nenhum (Retirar do colaborador / Voltar para estoque)</option>
                                {% for c in colaboradores %}
                                    <option value="{{ c.id }}">{{ c.nome }} ({{ c.departamento or 'Sem Depto' }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group" style="margin-bottom: 20px;">
                            <label for="status" style="display: block; margin-bottom: 6px;">Novo Status do Ativo</label>
                            <select id="status" name="status" required style="width: 100%; padding: 10px; background: #1e293b; color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                                <option value="Em Uso">Em Uso</option>
                                <option value="Disponível">Disponível</option>
                                <option value="Em Manutenção">Em Manutenção</option>
                                <option value="Baixado">Baixado</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-action" style="width: 100%; padding: 12px; cursor: pointer;">Confirmar Movimentação</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
