<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário TI - Novo Equipamento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Menu Lateral -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>Inventário TI</h2>
                <span>Equipe de Infra</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="{{ url_for('inicio') }}">Dashboard</a></li>
                <li><a href="{{ url_for('listar_equipamentos') }}">Equipamentos</a></li>
                <li><a href="{{ url_for('colaboradores') }}">Colaboradores</a></li>
                <li><a href="{{ url_for('atribuicoes') }}">Atribuições</a></li>
                <li><a href="{{ url_for('manutencao') }}">Manutenção</a></li>
                <li><a href="{{ url_for('estoque') }}">Estoque</a></li>
                <li><a href="{{ url_for('relatorios') }}">Relatórios</a></li>
                <li><a href="{{ url_for('configuracoes') }}">Configurações</a></li>
            </ul>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="top-header">
                <h1>Cadastrar Novo Ativo</h1>
                <div class="user-info">
                    <span>Usuário: <strong>Kevin TI</strong></span>
                </div>
            </header>

            <section class="dashboard-section">
                <div class="form-container">
                    <form action="{{ url_for('novo_equipamento') }}" method="POST">
                        <div class="form-group" style="margin-bottom: 14px;">
                            <label for="patrimonio">Número de Patrimônio</label>
                            <input type="text" id="patrimonio" name="patrimonio" placeholder="Ex: PAT-00123" required style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                        </div>

                        <div class="form-group" style="margin-bottom: 14px;">
                            <label for="numero_serie">Número de Série</label>
                            <input type="text" id="numero_serie" name="numero_serie" placeholder="Ex: SN-987654321" style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                        </div>

                        <div class="form-group" style="margin-bottom: 14px;">
                            <label for="tipo">Tipo de Equipamento</label>
                            <select id="tipo" name="tipo" required style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                                <option value="Notebook">Notebook</option>
                                <option value="Desktop">Desktop</option>
                                <option value="Switch">Switch</option>
                                <option value="Roteador">Roteador</option>
                                <option value="Impressora">Impressora</option>
                                <option value="Monitor">Monitor</option>
                                <option value="Mouse / Periférico">Mouse / Periférico</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>

                        <div class="form-group" style="margin-bottom: 14px;">
                            <label for="fabricante">Fabricante</label>
                            <input type="text" id="fabricante" name="fabricante" placeholder="Ex: Dell, Cisco, HP, Logitech" style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                        </div>

                        <div class="form-group" style="margin-bottom: 14px;">
                            <label for="modelo">Modelo</label>
                            <input type="text" id="modelo" name="modelo" placeholder="Ex: Catalyst 2960, Latitude 3420" style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                        </div>

                        <div class="form-group" style="margin-bottom: 14px;">
                            <label for="setor">Setor</label>
                            <input type="text" id="setor" name="setor" placeholder="Ex: TI, Financeiro, Recepção" required style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                        </div>

                        <!-- Seleção do Colaborador vinculado pelo ID -->
                        <div class="form-group" style="margin-bottom: 14px;">
                            <label for="colaborador_id">Colaborador Responsável (Opcional)</label>
                            <select id="colaborador_id" name="colaborador_id" style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                                <option value="">Nenhum (Apenas Setor / Em Estoque)</option>
                                {% for c in colaboradores %}
                                    <option value="{{ c.id }}">{{ c.nome }} ({{ c.departamento or 'Sem Depto' }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group" style="margin-bottom: 14px;">
                            <label for="status">Status</label>
                            <select id="status" name="status" required style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                                <option value="Disponível">Disponível</option>
                                <option value="Em Uso">Em Uso</option>
                                <option value="Em Manutenção">Em Manutenção</option>
                                <option value="Baixado">Baixado</option>
                            </select>
                        </div>

                        <div class="form-group" style="margin-bottom: 20px;">
                            <label for="observacoes">Observações</label>
                            <textarea id="observacoes" name="observacoes" rows="3" placeholder="Detalhes adicionais, acessórios inclusos, etc." style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid var(--border-color); border-radius: 4px;"></textarea>
                        </div>

                        <button type="submit" class="btn-action" style="width: 100%; padding: 12px; cursor: pointer;">Salvar Equipamento</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
